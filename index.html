<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>留言发布板</title>
    <style>
        /* 全局样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 40px 20px;
            color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        /* 主容器 */
        .dv {
            width: 100%;
            max-width: 680px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 32px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
        }

        /* 标题样式 */
        .dv>p:first-child {
            font-size: 22px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 20px;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dv>p:first-child::before {
            content: "";
            display: inline-block;
            width: 4px;
            height: 20px;
            background: #409eff;
            border-radius: 2px;
        }

        /* 输入区外层卡片 */
        .input-card {
            background: #ffffff;
            border: 1px solid #eaedf1;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
            margin-bottom: 24px;
        }

        /* 输入框容器 */
        .input-wrapper {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }

        /* 输入框样式 */
        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            background-color: #f8fafc;
            color: #334155;
            transition: all 0.2s ease;
        }

        input[type="text"]:focus {
            background-color: #fff;
            border-color: #409eff;
            box-shadow: 0 0 0 3px rgba(64, 158, 255, 0.15);
        }

        /* 操作栏：按钮与字数统计 */
        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .action-btns {
            display: flex;
            gap: 10px;
        }

        /* 统一按钮基础样式 */
        button {
            border: none;
            outline: none;
            font-size: 14px;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        /* 粘贴按钮样式 */
        .paste-btn {
            background-color: #f1f5f9;
            color: #475569;
            padding: 0 16px;
            height: 42px;
            border: 1px solid #e2e8f0;
        }

        .paste-btn:hover {
            background-color: #e2e8f0;
            color: #1e293b;
        }

        /* 发布按钮样式 */
        #publishButton {
            background: linear-gradient(135deg, #409eff 0%, #2b85e4 100%);
            color: #ffffff;
            padding: 0 24px;
            height: 38px;
            box-shadow: 0 4px 12px rgba(64, 158, 255, 0.3);
        }

        #publishButton:hover {
            opacity: 0.95;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(64, 158, 255, 0.4);
        }

        #publishButton:active {
            transform: translateY(0);
        }

        /* 字数统计 */
        .char-count {
            font-size: 13px;
            color: #94a3b8;
        }

        .char-count span {
            color: #409eff;
            font-weight: 600;
        }

        /* 留言列表样式 */
        ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        li {
            background: #ffffff;
            padding: 16px 20px;
            border-radius: 12px;
            border: 1px solid #f1f5f9;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
            transition: all 0.2s ease;
        }

        li:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.06);
            border-color: #e2e8f0;
        }

        li div {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
        }

        li img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid #e2e8f0;
        }

        li p.message-text {
            flex: 1;
            text-align: left;
            color: #334155;
            font-size: 15px;
            line-height: 1.5;
            word-break: break-all;
        }

        /* 复制与删除按钮 */
        .copy-btn {
            background-color: #f0f9ff;
            color: #0284c7;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
        }

        .copy-btn:hover {
            background-color: #e0f2fe;
        }

        .xx {
            background-color: #fef2f2;
            color: #ef4444;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-size: 16px;
            line-height: 1;
        }

        .xx:hover {
            background-color: #fee2e2;
            color: #dc2626;
        }

        /* 弹窗样式 */
        .token-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .token-modal-content {
            background: #ffffff;
            padding: 32px;
            border-radius: 16px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .token-modal-content h3 {
            margin-bottom: 16px;
            color: #0f172a;
            font-size: 18px;
        }

        .token-modal-content input {
            width: 100%;
            margin-bottom: 16px;
        }

        .token-modal-content button {
            width: 100%;
            padding: 12px;
            background: #409eff;
            color: white;
        }

        /* 同步提示样式 */
        .sync-tip {
            position: fixed;
            bottom: 24px;
            right: 24px;
            padding: 12px 20px;
            background: #10b981;
            color: white;
            font-size: 14px;
            font-weight: 500;
            border-radius: 8px;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease;
            pointer-events: none;
        }

        .sync-tip.show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>

<body>
    <div class="dv">
        <p>留言发布板</p>

        <div class="input-card">
            <div class="input-wrapper">
                <input type="text" maxlength="200" placeholder="撰写你的留言...">
                <button class="paste-btn">粘贴</button>
            </div>
            <div class="action-bar">
                <div class="char-count"><span id="charNum">0</span>/200</div>
                <button id="publishButton">发布留言</button>
            </div>
        </div>

        <ul id="messageList"></ul>
    </div>

    <div class="token-modal" id="tokenModal" style="display: none;">
        <div class="token-modal-content">
            <h3>GitHub Token 配置</h3>
            <div id="tokenError" style="color: #ef4444; font-size: 13px; margin-bottom: 12px;"></div>
            <input type="text" id="githubToken" placeholder="请输入你的 GitHub PAT">
            <button onclick="verifyAndSaveToken()">验证并保存</button>
        </div>
    </div>

    <div class="sync-tip" id="syncTip">✓ 同步成功</div>

    <script>
        let GITHUB_CONFIG = { token: '', username: '', repo: '', path: '留言.json' };
        const ul = document.getElementById('messageList');
        const input = document.querySelector('input[type="text"]');
        const span = document.getElementById('charNum');
        const pasteBtn = document.querySelector('.paste-btn');
        const publishBtn = document.getElementById('publishButton');
        const syncTip = document.getElementById('syncTip');

        function g0() { input.value = ''; span.innerHTML = 0; }
        function showSyncTip() { syncTip.classList.add('show'); setTimeout(() => syncTip.classList.remove('show'), 3000); }

        function parseGithubInfoFromUrl() {
            const url = window.location.href;
            const pagesRegex = /https?:\/\/([^.]+)\.github\.io\/([^\/]+)/;
            const repoRegex = /https?:\/\/github\.com\/([^\/]+)\/([^\/]+)/;
            let match = url.match(pagesRegex) || url.match(repoRegex);
            if (match) { GITHUB_CONFIG.username = match[1]; GITHUB_CONFIG.repo = match[2]; return true; }
            alert('URL 无法识别，请确保部署在 GitHub');
            return false;
        }

        async function verifyAndSaveToken() {
            const token = document.getElementById('githubToken').value.trim();
            const response = await fetch('https://api.github.com/user', { headers: { 'Authorization': `token ${token}` } });
            if (response.ok) {
                localStorage.setItem('github_token', token);
                GITHUB_CONFIG.token = token;
                document.getElementById('tokenModal').style.display = 'none';
                initMessages();
            } else {
                document.getElementById('tokenError').textContent = 'Token 无效，请重新输入';
            }
        }

        async function initGithubConfig() {
            if (!parseGithubInfoFromUrl()) return;
            const savedToken = localStorage.getItem('github_token');
            if (savedToken) { GITHUB_CONFIG.token = savedToken; initMessages(); }
            else { document.getElementById('tokenModal').style.display = 'flex'; }
        }

        async function getFileSha() {
            const r = await fetch(`https://api.github.com/repos/${GITHUB_CONFIG.username}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.path}`,
                { headers: { 'Authorization': `token ${GITHUB_CONFIG.token}` } });
            return r.ok ? (await r.json()).sha : null;
        }

        async function loadMessages() {
            const r = await fetch(`https://api.github.com/repos/${GITHUB_CONFIG.username}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.path}`,
                { headers: { 'Authorization': `token ${GITHUB_CONFIG.token}` } });
            if (r.ok) {
                const data = await r.json();
                return JSON.parse(decodeURIComponent(escape(atob(data.content))));
            }
            return [];
        }

        async function saveMessages(messages) {
            const sha = await getFileSha();
            const content = btoa(unescape(encodeURIComponent(JSON.stringify(messages, null, 2))));
            await fetch(`https://api.github.com/repos/${GITHUB_CONFIG.username}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.path}`, {
                method: 'PUT',
                headers: { 'Authorization': `token ${GITHUB_CONFIG.token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: 'Update', content, sha })
            });
            showSyncTip();
        }

        async function initMessages() {
            const messages = await loadMessages();
            ul.innerHTML = '';
            [...messages].reverse().forEach(msg => renderMessageUI(msg));
        }

        function renderMessageUI(content) {
            const li = document.createElement('li');
            li.innerHTML = `<div><img src="https://avatars.githubusercontent.com/u/0?s=24&v=4"><p class="message-text"></p><button class="copy-btn">复制</button><button class="xx">×</button></div>`;
            li.querySelector('.message-text').textContent = content;
            ul.insertBefore(li, ul.firstChild);

            li.querySelector('.copy-btn').onclick = () => {
                navigator.clipboard.writeText(content);
                const btn = li.querySelector('.copy-btn');
                btn.textContent = '已复制';
                setTimeout(() => btn.textContent = '复制', 2000);
            };

            li.querySelector('.xx').onclick = async () => {
                li.remove();
                const current = Array.from(ul.querySelectorAll('.message-text')).map(el => el.textContent);
                await saveMessages(current);
            };
        }

        publishBtn.onclick = async () => {
            const val = input.value.trim();
            if (!val) return;
            renderMessageUI(val);
            g0();
            const current = Array.from(ul.querySelectorAll('.message-text')).map(el => el.textContent);
            await saveMessages(current);
        };

        input.oninput = () => span.innerHTML = input.value.length;
        pasteBtn.onclick = () => navigator.clipboard.readText().then(t => { input.value = t; span.innerHTML = t.length; });
        window.onload = initGithubConfig;
    </script>
</body>

</html>
