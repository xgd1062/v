<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <!-- 移动端视口设置 -->
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>留言发布板</title>
    <style>
        /* 全局重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #f4f6f9;
            min-height: 100vh;
            padding: 16px;
            padding-bottom: calc(20px + env(safe-area-inset-bottom));
            color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        /* 主容器 */
        .dv {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }

        /* 页面标题 */
        .dv>p:first-child {
            font-size: 20px;
            font-weight: 700;
            color: #0f172a;
            margin: 8px 0 16px 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dv>p:first-child::before {
            content: "";
            display: inline-block;
            width: 4px;
            height: 18px;
            background: #3b82f6;
            border-radius: 2px;
        }

        /* 输入区卡片 */
        .input-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            margin-bottom: 20px;
        }

        /* 输入框容器 */
        .input-wrapper {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        /* 输入框样式 */
        input[type="text"] {
            flex: 1;
            padding: 12px 14px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            background-color: #f8fafc;
            color: #1e293b;
            transition: all 0.2s ease;
            appearance: none;
            -webkit-appearance: none;
        }

        input[type="text"]:focus {
            background-color: #ffffff;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        /* 统一按钮样式 */
        button {
            border: none;
            outline: none;
            font-size: 14px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        button:active {
            transform: scale(0.97);
        }

        /* 粘贴按钮 */
        .paste-btn {
            background-color: #eff6ff;
            color: #2563eb;
            padding: 0 16px;
            height: 46px;
            flex-shrink: 0;
        }

        /* 底部操作栏 */
        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .char-count {
            font-size: 13px;
            color: #94a3b8;
        }

        .char-count span {
            color: #2563eb;
            font-weight: 600;
        }

        /* 发布按钮 */
        #publishButton {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: #ffffff;
            padding: 0 20px;
            height: 40px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
        }

        /* 留言列表 */
        ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        li {
            background: #ffffff;
            padding: 16px;
            border-radius: 14px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
            border: 1px solid #f1f5f9;
        }

        /* 卡片主体：上下结构 */
        li .msg-card {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        /* 上半部分：头像和留言文字 */
        li .msg-header {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            width: 100%;
        }

        li img {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
        }

        li p.message-text {
            flex: 1;
            text-align: left;
            color: #334155;
            font-size: 15px;
            line-height: 1.6;
            word-break: break-all;
            /* 防止长字符串挤压布局 */
            padding-top: 4px;
        }

        /* 下半部分：操作按钮靠右置底 */
        .msg-actions {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 8px;
            border-top: 1px dashed #f1f5f9;
            padding-top: 10px;
            margin-top: 4px;
        }

        .copy-btn {
            background-color: #f1f5f9;
            color: #475569;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 13px;
            height: 32px;
        }

        .xx {
            background-color: #fef2f2;
            color: #ef4444;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 13px;
            height: 32px;
        }

        /* 弹窗样式 */
        .token-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 20px;
        }

        .token-modal-content {
            background: #ffffff;
            padding: 24px;
            border-radius: 20px;
            width: 100%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .token-modal-content h3 {
            margin-bottom: 12px;
            color: #0f172a;
            font-size: 18px;
        }

        .token-modal-content input {
            width: 100%;
            margin-bottom: 16px;
        }

        .token-modal-content button {
            width: 100%;
            height: 44px;
            background: #2563eb;
            color: white;
            font-size: 15px;
        }

        /* 顶部 Toast 提示 */
        .sync-tip {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            padding: 10px 20px;
            background: #10b981;
            color: white;
            font-size: 14px;
            font-weight: 500;
            border-radius: 30px;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
            z-index: 10000;
            white-space: nowrap;
        }

        .sync-tip.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>

<body>
    <div class="dv">
        <p>留言发布板</p>

        <div class="input-card">
            <div class="input-wrapper">
                <input type="text" maxlength="200" placeholder="撰写你的留言...">
                <button class="paste-btn">粘贴</button>
            </div>
            <div class="action-bar">
                <div class="char-count"><span id="charNum">0</span>/200</div>
                <button id="publishButton">发布留言</button>
            </div>
        </div>

        <ul id="messageList"></ul>
    </div>

    <div class="token-modal" id="tokenModal" style="display: none;">
        <div class="token-modal-content">
            <h3>GitHub Token 配置</h3>
            <div id="tokenError" style="color: #ef4444; font-size: 13px; margin-bottom: 12px;"></div>
            <input type="text" id="githubToken" placeholder="请输入 GitHub PAT">
            <button onclick="verifyAndSaveToken()">验证并保存</button>
        </div>
    </div>

    <div class="sync-tip" id="syncTip">✓ 同步成功</div>

    <script>
        let GITHUB_CONFIG = { token: '', username: '', repo: '', path: '留言.json' };
        const ul = document.getElementById('messageList');
        const input = document.querySelector('input[type="text"]');
        const span = document.getElementById('charNum');
        const pasteBtn = document.querySelector('.paste-btn');
        const publishBtn = document.getElementById('publishButton');
        const syncTip = document.getElementById('syncTip');

        function g0() { input.value = ''; span.innerHTML = 0; }
        function showSyncTip() { syncTip.classList.add('show'); setTimeout(() => syncTip.classList.remove('show'), 3000); }

        function parseGithubInfoFromUrl() {
            const url = window.location.href;
            const pagesRegex = /https?:\/\/([^.]+)\.github\.io\/([^\/]+)/;
            const repoRegex = /https?:\/\/github\.com\/([^\/]+)\/([^\/]+)/;
            let match = url.match(pagesRegex) || url.match(repoRegex);
            if (match) { GITHUB_CONFIG.username = match[1]; GITHUB_CONFIG.repo = match[2]; return true; }
            alert('URL 无法识别，请确保部署在 GitHub');
            return false;
        }

        async function verifyAndSaveToken() {
            const token = document.getElementById('githubToken').value.trim();
            const response = await fetch('https://api.github.com/user', { headers: { 'Authorization': `token ${token}` } });
            if (response.ok) {
                localStorage.setItem('github_token', token);
                GITHUB_CONFIG.token = token;
                document.getElementById('tokenModal').style.display = 'none';
                initMessages();
            } else {
                document.getElementById('tokenError').textContent = 'Token 无效，请重新输入';
            }
        }

        async function initGithubConfig() {
            if (!parseGithubInfoFromUrl()) return;
            const savedToken = localStorage.getItem('github_token');
            if (savedToken) { GITHUB_CONFIG.token = savedToken; initMessages(); }
            else { document.getElementById('tokenModal').style.display = 'flex'; }
        }

        async function getFileSha() {
            const r = await fetch(`https://api.github.com/repos/${GITHUB_CONFIG.username}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.path}`,
                { headers: { 'Authorization': `token ${GITHUB_CONFIG.token}` } });
            return r.ok ? (await r.json()).sha : null;
        }

        async function loadMessages() {
            const r = await fetch(`https://api.github.com/repos/${GITHUB_CONFIG.username}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.path}`,
                { headers: { 'Authorization': `token ${GITHUB_CONFIG.token}` } });
            if (r.ok) {
                const data = await r.json();
                return JSON.parse(decodeURIComponent(escape(atob(data.content))));
            }
            return [];
        }

        async function saveMessages(messages) {
            const sha = await getFileSha();
            const content = btoa(unescape(encodeURIComponent(JSON.stringify(messages, null, 2))));
            await fetch(`https://api.github.com/repos/${GITHUB_CONFIG.username}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.path}`, {
                method: 'PUT',
                headers: { 'Authorization': `token ${GITHUB_CONFIG.token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: 'Update', content, sha })
            });
            showSyncTip();
        }

        async function initMessages() {
            const messages = await loadMessages();
            ul.innerHTML = '';
            [...messages].reverse().forEach(msg => renderMessageUI(msg));
        }

        function renderMessageUI(content) {
            const li = document.createElement('li');
            li.innerHTML = `
                <div class="msg-card">
                    <div class="msg-header">
                        <img src="https://avatars.githubusercontent.com/u/0?s=24&v=4">
                        <p class="message-text"></p>
                    </div>
                    <div class="msg-actions">
                        <button class="copy-btn">复制</button>
                        <button class="xx">删除</button>
                    </div>
                </div>`;
            li.querySelector('.message-text').textContent = content;
            ul.insertBefore(li, ul.firstChild);

            li.querySelector('.copy-btn').onclick = () => {
                navigator.clipboard.writeText(content);
                const btn = li.querySelector('.copy-btn');
                btn.textContent = '已复制';
                setTimeout(() => btn.textContent = '复制', 2000);
            };

            li.querySelector('.xx').onclick = async () => {
                li.remove();
                const current = Array.from(ul.querySelectorAll('.message-text')).map(el => el.textContent);
                await saveMessages(current);
            };
        }

        publishBtn.onclick = async () => {
            const val = input.value.trim();
            if (!val) return;
            renderMessageUI(val);
            g0();
            const current = Array.from(ul.querySelectorAll('.message-text')).map(el => el.textContent);
            await saveMessages(current);
        };

        input.oninput = () => span.innerHTML = input.value.length;
        pasteBtn.onclick = () => navigator.clipboard.readText().then(t => { input.value = t; span.innerHTML = t.length; });
        window.onload = initGithubConfig;
    </script>
</body>

</html>
